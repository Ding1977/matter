# Public-repo CI — minimal three lanes (build / typecheck / test).
# Public Actions minutes are unlimited; this covers the packages/** whitelist only.
# Private-repo five-lane orchestration (gates / doc-sync / coverage / gate-selftests) stays private.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.28.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.28.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.28.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
